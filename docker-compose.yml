services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lenny
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lenny
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
